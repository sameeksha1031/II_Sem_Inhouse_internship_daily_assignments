<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact Sameeksha</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#8e44ad,#3498db);

}

.container{

background:white;
width:420px;
padding:35px;
border-radius:50px;
box-shadow:0 15px 30px rgba(0,0,0,.25);

}

h1{

text-align:center;
margin-bottom:25px;
color:#8e44ad;

}

input,
textarea{

width:100%;
padding:12px;
margin-bottom:18px;
border:1px solid #ccc;
border-radius:8px;
font-size:15px;

}

textarea{

resize:none;
height:120px;

}

button{

width:100%;
padding:14px;
background:#8e44ad;
border:none;
color:white;
font-size:17px;
border-radius:8px;
cursor:pointer;

}

button:hover{

background:#6d2b8d;

}

.back{

display:block;
margin-top:20px;
text-align:center;
text-decoration:none;
color:#8e44ad;
font-weight:bold;

}

</style>

</head>

<body>

<div class="container">

<h1>Contact Me</h1>

<form>

<input type="text" placeholder="Your Name" required>

<input type="email" placeholder="Your Email" required>

<input type="text" placeholder="Subject">

<textarea placeholder="Your Message"></textarea>

<button type="submit">Send Message</button>

</form>

<a href="index.html" class="back">← Back to Portfolio</a>

</div>

</body>
</html>
