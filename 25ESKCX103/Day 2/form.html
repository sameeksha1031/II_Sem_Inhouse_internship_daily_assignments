<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sameeksha Saini | Registration Form</title>
    <link rel="stylesheet" href="form.css">
</head>

<body>

<div class="container">

    <form class="form">

        <h1>Sameeksha Saini</h1>
        <p class="subtitle">B.Tech Data Science Registration Form</p>
        <hr>

        <label for="name">Full Name</label>
        <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            required>

        <label for="email">Email Address</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required>

        <div class="row">

            <div class="col">

                <label for="phone">Phone Number</label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter phone number"
                    required>

            </div>

            <div class="col">

                <label for="dob">Date of Birth</label>

                <input
                    type="date"
                    id="dob">

            </div>

        </div>

        <label>Gender</label>

        <div class="gender">

            <label>
                <input type="radio" name="gender">
                Female
            </label>

            <label>
                <input type="radio" name="gender">
                Male
            </label>

            <label>
                <input type="radio" name="gender">
                Other
            </label>

        </div>

        <label for="address">Address</label>

        <input
            type="text"
            id="address"
            placeholder="Street Address">

        <input
            type="text"
            placeholder="Apartment, Suite, etc.">

        <div class="row">

            <div class="col">

                <label>Country</label>

                <select>

                    <option>Select Country</option>
                    <option>India</option>
                    <option>USA</option>
                    <option>Canada</option>
                    <option>Australia</option>

                </select>

            </div>

            <div class="col">

                <label>City</label>

                <input
                    type="text"
                    placeholder="Enter City">

            </div>

        </div>

        <div class="row">

            <div class="col">

                <label>State</label>

                <input
                    type="text"
                    placeholder="Enter State">

            </div>

            <div class="col">

                <label>Postal Code</label>

                <input
                    type="text"
                    placeholder="Postal Code">

            </div>

        </div>

        <button type="submit">Register</button>

    </form>

</div>

</body>
</html>
